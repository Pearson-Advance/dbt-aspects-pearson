        rows: |
          select
              '201' as source_id, '1' as event_id, '11' as institution_ccx_id,
              '7' as institution_id, cast(null as Nullable(String)) as license_id,
              'course-v1:Test+CCX+1' as class_id,
              cast(null as Nullable(String)) as master_course_id,
              'UPSERT' as operation, 'False' as is_deleted,
              '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-111111111131') as dump_id,
              toUUID('22222222-2222-2222-2222-222222222231') as sink_event_id, '2' as schema_version
          union all
          select
              '202', '2', '12', '7', '5', 'course-v1:Test+CCX+2', 'course-v1:Test+Master+1',
              'DELETE', 'True', '2026-01-01 01:00:00.000000+00:00',
              '2026-01-01 01:00:01.000000+00:00',
              toUUID('11111111-1111-1111-1111-111111111132'),
              toUUID('22222222-2222-2222-2222-222222222232'), '2'
    expect:
      format: sql
      rows: |
        select
            '201' as source_id, '1' as event_id, '11' as institution_ccx_id,
            '7' as institution_id, cast(null as Nullable(String)) as license_id,
            'course-v1:Test+CCX+1' as class_id,
            cast(null as Nullable(String)) as master_course_id,
            'UPSERT' as operation, 'False' as is_deleted,
            '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
            '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
            toUUID('11111111-1111-1111-1111-111111111131') as dump_id,
            toUUID('22222222-2222-2222-2222-222222222231') as sink_event_id, '2' as schema_version
