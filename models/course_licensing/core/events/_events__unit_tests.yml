unit_tests:
  - name: test_course_licensing_event_current_filters_tombstones
    model: int_course_licensing_event_current
    given:
      - input: ref("int_course_licensing_event_latest_state")
        format: sql
        rows: |
          select
              '1' as source_id, '2026-01-01T00:00:00Z' as created,
              '2026-01-01T00:05:00Z' as modified, '10' as user_id,
              'owner' as username, 'owner@example.com' as user_email,
              cast(null as Nullable(String)) as description, 'Office hours' as title,
              '2026-01-10T10:00:00Z' as start, '2026-01-10T11:00:00Z' as end,
              'busy' as availability, 'meeting' as event_type,
              cast(null as Nullable(String)) as recurrence,
              cast(null as Nullable(String)) as recurrence_end, 'False' as is_class,
              'UPSERT' as operation, 'False' as is_deleted,
              '2026-01-01 00:05:00.000000+00:00' as source_updated_at,
              '2026-01-01 00:05:01.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-111111111111') as dump_id,
              toUUID('22222222-2222-2222-2222-222222222221') as sink_event_id,
              '2' as schema_version
          union all
          select
              '2', '2026-01-01T00:00:00Z', '2026-01-01T01:05:00Z', '20',
              'deleted', 'deleted@example.com', 'removed', 'Deleted event',
              '2026-01-11T10:00:00Z', '2026-01-11T11:00:00Z', 'busy', 'meeting',
              'FREQ=WEEKLY', '2026-02-01T00:00:00Z', 'False', 'DELETE', 'True',
              '2026-01-01 01:05:00.000000+00:00',
              '2026-01-01 01:05:01.000000+00:00',
              toUUID('11111111-1111-1111-1111-111111111112'),
              toUUID('22222222-2222-2222-2222-222222222222'), '2'
    expect:
      format: sql
      rows: |
        select
            '1' as source_id, '2026-01-01T00:00:00Z' as created,
            '2026-01-01T00:05:00Z' as modified, '10' as user_id,
            'owner' as username, 'owner@example.com' as user_email,
            cast(null as Nullable(String)) as description, 'Office hours' as title,
            '2026-01-10T10:00:00Z' as start, '2026-01-10T11:00:00Z' as end,
            'busy' as availability, 'meeting' as event_type,
            cast(null as Nullable(String)) as recurrence,
            cast(null as Nullable(String)) as recurrence_end, 'False' as is_class,
            'UPSERT' as operation, 'False' as is_deleted,
            '2026-01-01 00:05:00.000000+00:00' as source_updated_at,
            '2026-01-01 00:05:01.000000+00:00' as time_last_dumped,
            toUUID('11111111-1111-1111-1111-111111111111') as dump_id,
            toUUID('22222222-2222-2222-2222-222222222221') as sink_event_id,
            '2' as schema_version

  - name: test_course_licensing_event_exception_current_preserves_cancellations
    model: int_course_licensing_event_exception_current
    given:
      - input: ref("int_course_licensing_event_exception_latest_state")
        format: sql
        rows: |
          select
              '101' as source_id, '1' as event_id,
              cast(null as Nullable(String)) as title,
              cast(null as Nullable(String)) as start,
              cast(null as Nullable(String)) as end,
              cast(null as Nullable(String)) as event_type,
              'True' as exception_is_deleted, '2026-01-10T10:00:00Z' as original_start,
              'UPSERT' as operation, 'False' as is_deleted,
              '2026-01-02 00:00:00.000000+00:00' as source_updated_at,
              '2026-01-02 00:00:01.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-111111111121') as dump_id,
              toUUID('22222222-2222-2222-2222-222222222221') as sink_event_id, '2' as schema_version
          union all
          select
              '102', '1', 'override', '2026-01-17T12:00:00Z', '2026-01-17T13:00:00Z',
              'meeting', 'False', '2026-01-17T10:00:00Z', 'DELETE', 'True',
              '2026-01-03 00:00:00.000000+00:00', '2026-01-03 00:00:01.000000+00:00',
              toUUID('11111111-1111-1111-1111-111111111122'),
              toUUID('22222222-2222-2222-2222-222222222222'), '2'
    expect:
      format: sql
      rows: |
        select
            '101' as source_id, '1' as event_id,
            cast(null as Nullable(String)) as title,
            cast(null as Nullable(String)) as start,
            cast(null as Nullable(String)) as end,
            cast(null as Nullable(String)) as event_type,
            'True' as exception_is_deleted, '2026-01-10T10:00:00Z' as original_start,
            'UPSERT' as operation, 'False' as is_deleted,
            '2026-01-02 00:00:00.000000+00:00' as source_updated_at,
            '2026-01-02 00:00:01.000000+00:00' as time_last_dumped,
            toUUID('11111111-1111-1111-1111-111111111121') as dump_id,
            toUUID('22222222-2222-2222-2222-222222222221') as sink_event_id, '2' as schema_version

