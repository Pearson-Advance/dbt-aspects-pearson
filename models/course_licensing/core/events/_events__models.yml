              field: source_id
              config:
                severity: warn
      - name: institution_id
        description: Denormalized institution identifier preserved from the sink; no duplicate ownership relationship test is added.
      - name: license_id
        description: Optional denormalized license identifier preserved from the sink.
      - name: master_course_id
        description: Optional parent master course key preserved from the sink.
      - name: is_deleted
        description: Always 'False' in the current model by construction.
        data_tests:
          - accepted_values:
              values: ["False"]
