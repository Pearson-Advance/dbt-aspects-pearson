unit_tests:
  - name: test_course_licensing_bulk_user_register_task_current_handles_uuid_and_nullable_fields
    model: int_course_licensing_bulk_user_register_task_current
    given:
      - input: ref("int_course_licensing_bulk_user_register_task_latest_state")
        format: sql
        rows: |
          select
              'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa' as source_id, 'PENDING' as status,
              cast(null as Nullable(String)) as filename,
              cast(null as Nullable(String)) as errors,
              'UPSERT' as operation, 'False' as is_deleted,
              '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-111111111171') as dump_id,
              toUUID('22222222-2222-2222-2222-222222222271') as sink_event_id, '2' as schema_version
          union all
          select
              'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb', 'FAILED', 'users.csv',
              '[{"row":2,"error":"invalid email"}]', 'DELETE', 'True',
              '2026-01-01 01:00:00.000000+00:00', '2026-01-01 01:00:01.000000+00:00',
              toUUID('11111111-1111-1111-1111-111111111172'),
              toUUID('22222222-2222-2222-2222-222222222272'), '2'
    expect:
      format: sql
      rows: |
        select
            'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa' as source_id, 'PENDING' as status,
            cast(null as Nullable(String)) as filename,
            cast(null as Nullable(String)) as errors,
            'UPSERT' as operation, 'False' as is_deleted,
            '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
            '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
            toUUID('11111111-1111-1111-1111-111111111171') as dump_id,
            toUUID('22222222-2222-2222-2222-222222222271') as sink_event_id, '2' as schema_version
