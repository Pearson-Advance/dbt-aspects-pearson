version: 2
models:
- name: mv_course_licensing_instructor_latest_state
  description: >-
    Incrementally maintained argMax aggregate state, one row per source_id, tracking the most recent Instructor
    sink event.
  columns:
  - name: source_id
    description: Raw Django primary key of the source Instructor row.
    data_tests:
    - not_null
  - name: latest_state
    description: Opaque argMaxState aggregate finalized by the corresponding latest-state view.
- name: int_course_licensing_instructor_latest_state
  description: One finalized latest UPSERT or DELETE event per Instructor source_id.
  columns:
  - name: source_id
    description: Raw Django primary key of the source Instructor row.
    data_tests:
    - unique
    - not_null
  - name: is_deleted
    description: Sink tombstone flag stored as 'True'/'False'.
    data_tests:
    - accepted_values:
        values:
        - 'True'
        - 'False'
  - name: time_last_dumped
    description: When this event was written to ClickHouse.
  - name: sink_event_id
    description: Final deterministic tie-breaker for the latest-event ordering.
- name: int_course_licensing_instructor_current
  description: Current non-deleted representation of Instructor, one row per source_id.
  data_tests:
  - course_licensing_current_matches_latest_event:
      source_name: course_licensing_event_sink
      source_table: course_licensing_instructor
  columns:
  - name: source_id
    description: Raw Django primary key of the source Instructor row.
    data_tests:
    - unique
    - not_null
  - name: user_id
    description: Open edX user identifier represented by the instructor.
    data_tests:
    - not_null
  - name: is_deleted
    description: Always 'False' in the current model.
    data_tests:
    - accepted_values:
        values:
        - 'False'
