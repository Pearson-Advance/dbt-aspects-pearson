    description: Raw Django primary key of the source Instructor Institution row.
    data_tests:
    - unique
    - not_null
  - name: is_deleted
    description: Sink tombstone flag stored as 'True'/'False'.
    data_tests:
    - accepted_values:
        values:
        - 'True'
        - 'False'
  - name: time_last_dumped
