  - name: sink_event_id
    description: Final deterministic tie-breaker for the latest-event ordering.
- name: int_course_licensing_instructor_institution_current
  description: Current non-deleted representation of Instructor Institution, one row per source_id.
  data_tests:
  - course_licensing_current_matches_latest_event:
      source_name: course_licensing_event_sink
      source_table: course_licensing_instructor_institution
  columns:
  - name: source_id
    description: Raw Django primary key of the source Instructor Institution row.
    data_tests:
    - unique
    - not_null
  - name: instructor_id
    description: Related Instructor source_id.
    data_tests:
    - not_null
    - relationships:
        to: ref('int_course_licensing_instructor_current')
        field: source_id
  - name: institution_id
    description: Related Institution source_id.
    data_tests:
    - not_null
    - relationships:
        to: ref('int_course_licensing_institution_current')
        field: source_id
  - name: has_enrollment_privilege
    description: Whether the assignment grants enrollment-management privileges.
  - name: is_deleted
    description: Always 'False' in the current model.
    data_tests:
    - accepted_values:
        values:
        - 'False'
