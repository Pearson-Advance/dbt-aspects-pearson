unit_tests:
- name: test_course_licensing_course_current_filters_tombstones
  description: The current view keeps active course rows and excludes tombstones.
  model: int_course_licensing_course_current
  given:
  - input: ref("int_course_licensing_course_latest_state")
    format: sql
    rows: >-
      select 1 as source_id, '1' as master_course_id, 'master_course_name_1' as master_course_name,
          'UPSERT' as operation, 'False' as is_deleted,
          '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
          '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
          toUUID('11111111-1111-1111-1111-000000000001') as dump_id,
          toUUID('22222222-2222-2222-2222-000000000001') as sink_event_id, '2' as schema_version
      union all

      select 2 as source_id, '2' as master_course_id, 'master_course_name_2' as master_course_name,
          'DELETE' as operation, 'True' as is_deleted,
          '2026-01-01 00:00:01.000000+00:00' as source_updated_at,
          '2026-01-01 00:00:02.000000+00:00' as time_last_dumped,
          toUUID('11111111-1111-1111-1111-000000000002') as dump_id,
          toUUID('22222222-2222-2222-2222-000000000002') as sink_event_id, '2' as schema_version
  expect:
    format: sql
    rows: >-
      select 1 as source_id, '1' as master_course_id, 'master_course_name_1' as master_course_name,
          'UPSERT' as operation, 'False' as is_deleted,
          '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
          '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
          toUUID('11111111-1111-1111-1111-000000000001') as dump_id,
          toUUID('22222222-2222-2222-2222-000000000001') as sink_event_id, '2' as schema_version
- name: test_course_licensing_other_course_settings_cache_current_filters_tombstones
  description: The current view keeps active other_course_settings_cache rows and excludes tombstones.
  model: int_course_licensing_other_course_settings_cache_current
  given:
  - input: ref("int_course_licensing_other_course_settings_cache_latest_state")
    format: sql
    rows: >-
      select 1 as source_id, '2026-01-01T00:00:00Z' as created, '2026-01-01T00:00:00Z' as modified,
          '1' as master_course_id, '{"grading": {"passing_grade": 0.7}}' as settings, 'UPSERT' as operation,
          'False' as is_deleted, '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
          '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
          toUUID('11111111-1111-1111-1111-000000000001') as dump_id,
          toUUID('22222222-2222-2222-2222-000000000001') as sink_event_id, '2' as schema_version
      union all

      select 2 as source_id, '2026-01-01T00:00:00Z' as created, '2026-01-01T00:00:00Z' as modified,
          '2' as master_course_id, '{"grading": {"passing_grade": 0.7}}' as settings, 'DELETE' as operation,
          'True' as is_deleted, '2026-01-01 00:00:01.000000+00:00' as source_updated_at,
          '2026-01-01 00:00:02.000000+00:00' as time_last_dumped,
          toUUID('11111111-1111-1111-1111-000000000002') as dump_id,
          toUUID('22222222-2222-2222-2222-000000000002') as sink_event_id, '2' as schema_version
  expect:
    format: sql
    rows: >-
      select 1 as source_id, '2026-01-01T00:00:00Z' as created, '2026-01-01T00:00:00Z' as modified,
          '1' as master_course_id, '{"grading": {"passing_grade": 0.7}}' as settings, 'UPSERT' as operation,
          'False' as is_deleted, '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
          '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
          toUUID('11111111-1111-1111-1111-000000000001') as dump_id,
          toUUID('22222222-2222-2222-2222-000000000001') as sink_event_id, '2' as schema_version
