        data_tests:
          - not_null
      - name: resource_link_id
        description: Optional LTI resource-link identifier; may be null.
      - name: last_launch_attempt_date
        description: Last-launch timestamp supplied by the source and used by the serializer as source_updated_at.
      - name: is_deleted
