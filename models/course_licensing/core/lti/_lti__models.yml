version: 2

models:
  - name: mv_course_licensing_lti_tool_institution_latest_state
    description: >
      Incrementally maintained argMax aggregate state, one row per source_id,
      tracking the most recent LTIToolInstitution sink event. This is an internal
      operational model and is not a dashboard-facing projection.
    columns:
      - name: source_id
        description: Raw Django primary key of the source LTIToolInstitution row.
        data_tests:
          - not_null
      - name: latest_state
        description: >
          Opaque argMaxState aggregate finalized by
          int_course_licensing_lti_tool_institution_latest_state.

  - name: int_course_licensing_lti_tool_institution_latest_state
    description: >
      One finalized latest UPSERT or DELETE event per LTIToolInstitution source_id.
      Tombstones remain present here and are filtered only by the current view.
    columns:
      - name: source_id
        description: Raw Django primary key of the source LTIToolInstitution row.
        data_tests:
          - unique
          - not_null
      - name: is_deleted
        description: Sink tombstone flag stored as 'True'/'False'.
        data_tests:
          - accepted_values:
              values: ["True", "False"]
      - name: time_last_dumped
        description: Primary per-record latest-event ordering timestamp supplied by the sink.
      - name: source_updated_at
        description: Source-side timestamp supplied by the serializer, including related-event or fallback timestamps.
      - name: sink_event_id
        description: Final deterministic tie-breaker for latest-event ordering.
  - name: int_course_licensing_lti_tool_institution_current
    description: >
      Internal current-state representation of LTIToolInstitution, exactly one row per
      source_id whose latest sink event is not a DELETE. Restricted operational
      fields remain internal; dashboard-facing projections are separate scope.
    data_tests:
      - course_licensing_current_matches_latest_event:
          source_name: course_licensing_event_sink
          source_table: course_licensing_lti_tool_institution
    columns:
      - name: source_id
        description: Raw Django primary key of the source LTIToolInstitution row.
        data_tests:
          - unique
          - not_null
      - name: lti1p3_tool_id
        description: Source LTI 1.3 tool identifier.
        data_tests:
          - not_null
      - name: institution_id
        description: Parent Institution source_id.
        data_tests:
          - not_null
          - relationships:
              to: ref('int_course_licensing_institution_current')
              field: source_id
              config:
                severity: warn
      - name: institution_name
        description: Denormalized institution display name preserved exactly from the sink.
      - name: is_deleted
        description: Always 'False' in the current model by construction.
        data_tests:
          - accepted_values:
              values: ["False"]
