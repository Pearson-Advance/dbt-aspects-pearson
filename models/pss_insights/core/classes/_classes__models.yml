version: 2

models:
  - name: int_pss_class_scope
    description: >
      PSS Insights class population, one row per class (CCX): Course
      Licensing classes that are neither sync tombstones nor soft-deleted
      (deleted = 'False'), whatever their license status.
    columns:
      - name: institution_ccx_id
        description: InstitutionCCX primary key.
        data_tests:
          - unique
          - not_null
      - name: ccx_id
        description: CCX course key (ccx-v1:ORG+COURSE+RUN+ccx@N).
        data_tests:
          - unique
          - not_null
      - name: license_status
        description: active / disabled / deleted, exposed for filtering.
      - name: master_course
        description: >
          Master course key (course-v1). Taken from the CCX key when the sink
          left it empty. Classes without one are left out of the PSS models.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: master_course_from_ccx_key
        description: >
          True when master_course was empty in Course Licensing and was
          derived from the CCX key. Listed by a warn test.
        data_tests:
          - accepted_values:
              values: [false]
              quote: false
              config:
                severity: warn
      - name: ccx_number
        description: The N in ccx@N, used to build CCX block keys.

  - name: int_pss_master_course_scope
    description: >
      One row per master course with at least one in-scope class. The PSS
      models only cover these courses.
    columns:
      - name: master_course
        data_tests:
          - unique
          - not_null
