version: 2

seeds:
  - name: pss_assignment_type_mapping
    description: Reviewed mapping from an exact, case-sensitive Studio assignment type on a master to its PSS reporting type. Content owns the rows.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [master_course, assignment_type]
    columns:
      - name: master_course
        data_tests: [not_null]
      - name: assignment_type
        data_tests: [not_null]
      - name: activity_type
        data_tests:
          - not_null
          - accepted_values:
              values: ["Quiz", "Lab", "Practice Exam", "Final Exam"]
  - name: pss_curriculum_applicability
    description: >-
      Optional reviewed class applicability evidence, replaceable with a ref via
      pss_class_applicability_model. An inherit_master row can cover one CCX or
      all of a master's CCXs (empty ccx_id), and one revision or all revisions
      (empty snapshot_id). Include_subsection rows enumerate a complete verified
      subset for one CCX and revision. An empty rule explicitly confirms that
      no subsections apply. A class-specific rule takes precedence over master
      approval; a class with only stale evidence has unknown applicability.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [master_course, ccx_id, snapshot_id, subsection_block_id]
    columns:
      - name: rule
        data_tests:
          - accepted_values:
              values: [inherit_master, include_subsection, empty]

models:
  - name: int_pss_assignment_publications
    description: One row per master and source publication instant. Replay deduplicates by revision and payload. Conflicting, malformed or unorderable revisions are unavailable.
  - name: int_pss_subsection_assignments
    description: One row per valid Studio revision and subsection, including ungraded blocks. The activity type uses the current approved master mapping.
  - name: int_pss_master_publication
    description: Latest snapshot evidence and its freshness/structure status per scoped master. A positive current result needs a confirmed LMS head observation on this revision. A later CourseOverview modification flags a potentially stale snapshot.
  - name: int_pss_master_inventory_coverage
    description: One row per scoped master with counts of currently observed graded and classified subsections. Historical activities never establish current coverage.
    columns:
      - name: master_course
        data_tests: [unique, not_null]
  - name: int_pss_class_publication_applicability
    description: One effective approval for a CCX and a publication. Declared subset IDs must exist in the exact snapshot.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ccx_id, master_course, snapshot_id]
  - name: int_pss_class_inventory_coverage
    description: >-
      One row per in-scope CCX. Only classified and no_graded_subsections indicate
      a complete, applicable inventory. Inspect publication_status and applicability_status
      to diagnose missing, stale or conflicting inputs independently of attempts.
    columns:
      - name: ccx_id
        data_tests: [unique, not_null]
  - name: int_pss_activity_catalog
    description: Recognized, graded and applicable activities per CCX and master subsection, including never-attempted activities and observed historical revisions.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ccx_id, subsection_block_id]
    columns:
      - name: ccx_id
        data_tests:
          - not_null
          - relationships: {to: ref('int_pss_class_scope'), field: ccx_id}
      - name: master_course
        data_tests:
          - not_null
          - relationships: {to: ref('int_pss_master_course_scope'), field: master_course}
      - name: ccx_subsection_block_id
        description: Class-specific opaque usage key for joining attempts.
        data_tests: [not_null]
      - name: assignment_type
        description: Raw Studio Graded as value at the reported revision.
        data_tests: [not_null]
      - name: activity_type
        data_tests:
          - not_null
          - accepted_values:
              values: ["Quiz", "Lab", "Practice Exam", "Final Exam"]
      - name: activity_sequence
        description: Dense 1-based sequence of current classified applicable activities. Historical rows have NULL sequence and section.
  - name: int_pss_activity_type_coverage
    description: >-
      One row per master and observed graded subsection, including historical
      subsections. Counts come from the same Studio publication as the assignment
      type; fallback structure evidence has unknown counts and assignment type.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [master_course, subsection_block_id]
    columns:
      - name: coverage_status
        data_tests:
          - accepted_values:
              values: [classified, unmapped_assignment_type, assignment_type_unavailable]
