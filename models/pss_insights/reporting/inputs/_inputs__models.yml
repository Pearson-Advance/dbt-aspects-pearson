version: 2

models:
  - name: int_pss_reporting_roster
    description: Current distinct registered, resolved class memberships supplied by the class context.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ccx_id, actor_id]
    columns:
      - name: ccx_id
        data_tests: [not_null]
      - name: actor_id
        data_tests: [not_null]
  - name: int_pss_reporting_class_coverage
    description: Current institution/CCX/publication reconciliation for navigation and all Final Exam providers. e.g. withdrawn, expired or out-of-scope claims cannot certify an outcome.
    columns:
      - name: ccx_id
        data_tests: [unique, not_null]
  - name: int_pss_reporting_coverage
    description: The bounded score model ledger plus independent, unexpired all-history claims for the exact institution, CCX, publication and activity. Full-history evidence has two NULL bounds.
    columns:
      - name: ccx_id
        data_tests: [not_null]
      - name: subsection_block_id
        data_tests: [not_null]
  - name: int_pss_reporting_unlinked_attempts
    description: Registered learner sittings that the score models could not assign to the class activity evidence. Restricted to the fields needed to withhold affected coverage claims.
