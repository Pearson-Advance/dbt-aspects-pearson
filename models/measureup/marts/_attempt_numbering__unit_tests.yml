unit_tests:
  - name: test_mart_measureup_attempt_numbering_retains_all_attempts
    description: >
      Number all distinct attempts across modes and states, independently by
      learner, course and exact test ID. Compare UTC instants and numeric PKs
      for ties. Preserve unresolved attempts, without letting invalid starts
      or unresolved licensed classes shift eligible ordinals.
    model: mart_measureup_attempt_numbering
    given:
      - input: ref("mart_measureup_attempt_context")
        format: sql
        rows: |
          select
              exam_attempt_id, exam_test_id, flow_state,
              attempt_initiated_datetime,
              cast(null as Nullable(String)) as attempt_finished_datetime,
              '' as attempt_duration, cast(null as Nullable(String)) as final_score,
              'False' as is_passed, mode,
              'Same test name' as exam_test_name, 'same-product' as exam_test_product_id,
              has_lti_context, lti_user_id, lti_course_id,
              has_licensed_class_context, '1' as institution_ccx_id,
              '1' as institution_id, '1' as license_id, 'Class' as class_name,
              'student' as attempt_user_type
          from values(
              'exam_attempt_id String, exam_test_id Nullable(String),
              lti_user_id Nullable(String), lti_course_id Nullable(String),
              attempt_initiated_datetime Nullable(String),
              has_lti_context Bool, has_licensed_class_context Bool,
              mode String, flow_state String',
              ('1', '101', '9', 'class-a', '2026-01-01T09:00:00Z', true, true, 'training', 'complete'),
              ('2', '101', '9', 'class-a', '2026-01-01T10:00:00Z', true, true, 'training', 'complete'),
              ('10', '101', '9', 'class-a', '2026-01-01T05:00:00-05:00', true, true, 'certification', 'incomplete'),
              ('11', '101', '10', 'class-a', '2026-01-01T09:00:00Z', true, true, 'training', 'complete'),
              ('12', '101', '9', 'class-b', '2026-01-01T09:00:00Z', true, true, 'training', 'complete'),
              ('13', '102', '9', 'class-a', '2026-01-01T09:00:00Z', true, true, 'training', 'complete'),
              ('20', '101', NULL, 'class-a', '2026-01-01T09:00:00Z', true, true, 'training', 'complete'),
              ('21', '101', '', 'class-a', '2026-01-01T09:00:00Z', true, true, 'training', 'complete'),
              ('22', '101', '9', NULL, '2026-01-01T09:00:00Z', true, true, 'training', 'complete'),
              ('23', '101', '9', '', '2026-01-01T09:00:00Z', true, true, 'training', 'complete'),
              ('24', NULL, '9', 'class-a', '2026-01-01T09:00:00Z', true, true, 'training', 'complete'),
              ('25', '', '9', 'class-a', '2026-01-01T09:00:00Z', true, true, 'training', 'complete'),
              ('26', '101', '9', 'class-a', NULL, true, true, 'training', 'incomplete'),
              ('27', '101', '9', 'class-a', '', true, true, 'training', 'incomplete'),
              ('28', '101', '9', 'class-a', 'invalid', true, true, 'training', 'incomplete'),
              ('29', '101', '9', 'class-a', '2026-01-01T08:00:00Z', false, true, 'training', 'complete'),
              ('30', '101', '9', 'class-a', '2026-01-01T08:00:00Z', true, false, 'training', 'complete'),
              ('31', '101', '11', 'class-a', '2026-01-01T23:30:00-05:00', true, true, 'training', 'complete'),
              ('32', '101', '11', 'class-a', '2026-01-02T02:00:00Z', true, true, 'training', 'complete'),
              ('bad-id', '101', '12', 'class-a', '2026-01-01T09:00:00Z', true, true, 'training', 'complete'),
              ('3', '101', '12', 'class-a', '2026-01-01T09:00:00Z', true, true, 'training', 'complete')
          )
    expect:
      format: sql
      rows: |
        select *
        from values(
            'exam_attempt_id String, attempt_number Nullable(UInt64)',
            ('1', 1), ('2', 2), ('10', 3),
            ('11', 1), ('12', 1), ('13', 1),
            ('20', NULL), ('21', NULL), ('22', NULL), ('23', NULL),
            ('24', NULL), ('25', NULL), ('26', NULL), ('27', NULL),
            ('28', NULL), ('29', NULL), ('30', NULL), ('31', 2), ('32', 1),
            ('bad-id', 1), ('3', 2)
        )

  - name: test_mart_measureup_attempt_numbering_recomputes_corrected_history
    description: >
      A late older attempt is first, a corrected start changes order, and a
      recovered learner context joins the existing sequence. Attempt 2 has
      already been removed upstream by a tombstone; it must leave no gap.
      A metadata or mode change does not reset a sequence on the same test ID.
    model: mart_measureup_attempt_numbering
    given:
      - input: ref("mart_measureup_attempt_context")
        format: sql
        rows: |
          select
              exam_attempt_id, '101' as exam_test_id, flow_state,
              attempt_initiated_datetime,
              cast(null as Nullable(String)) as attempt_finished_datetime,
              '' as attempt_duration, final_score, 'False' as is_passed, mode,
              exam_test_name, 'same-product' as exam_test_product_id,
              true as has_lti_context, '9' as lti_user_id, 'class-a' as lti_course_id,
              true as has_licensed_class_context, '1' as institution_ccx_id,
              '1' as institution_id, '1' as license_id, 'Class' as class_name,
              attempt_user_type
          from values(
              'exam_attempt_id String, attempt_initiated_datetime String,
              flow_state String, mode String, final_score Nullable(String),
              exam_test_name String, attempt_user_type String',
              ('1', '2026-01-01T11:00:00Z', 'complete', 'training', '70', 'Old name', 'student'),
              ('10', '2026-01-01T10:00:00Z', 'incomplete', 'certification', NULL, 'New name', 'student'),
              ('40', '2026-01-01T08:00:00Z', 'complete', 'training', '80', 'New name', 'student'),
              ('20', '2026-01-01T09:30:00Z', 'complete', 'training', '90', 'New name', 'student'),
              ('50', '2026-01-01T12:00:00Z', 'complete', 'training', '95', 'New name', 'instructor')
          )
    expect:
      format: sql
      rows: |
        select *
        from values(
            'exam_attempt_id String, attempt_number Nullable(UInt64)',
            ('40', 1), ('20', 2), ('10', 3), ('1', 4), ('50', 5)
        )
