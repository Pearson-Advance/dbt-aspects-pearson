unit_tests:
  - name: test_mart_measureup_attempt_numbering_retains_all_attempts
    description: >
      Number finished attempts independently by learner, course, exact test ID
      and normalized mode. Compare UTC instants and numeric PKs for ties.
      Preserve ineligible attempts without shifting qualifying ordinals.
    model: mart_measureup_attempt_numbering
    given:
      - input: ref("mart_measureup_attempt_context")
        format: sql
        rows: |
          select
              exam_attempt_id, exam_test_id, flow_state,
              attempt_initiated_datetime,
              cast(null as Nullable(String)) as attempt_finished_datetime,
              '' as attempt_duration, cast(null as Nullable(String)) as final_score,
              'False' as is_passed, mode,
              'Same test name' as exam_test_name, 'same-product' as exam_test_product_id,
              has_lti_context, lti_user_id, lti_course_id,
              has_licensed_class_context, '1' as institution_ccx_id,
              '1' as institution_id, '1' as license_id, 'Class' as class_name,
              'student' as attempt_user_type
          from values(
              'exam_attempt_id String, exam_test_id Nullable(String),
              lti_user_id Nullable(String), lti_course_id Nullable(String),
              attempt_initiated_datetime Nullable(String),
              has_lti_context Bool, has_licensed_class_context Bool,
              mode Nullable(String), flow_state Nullable(String)',
              ('1', '101', '9', 'class-a', '2026-01-01T09:00:00Z', true, true, 'training', 'finished'),
              ('2', '101', '9', 'class-a', '2026-01-01T10:00:00Z', true, true, ' Training ', 'finished'),
              ('4', '101', '9', 'class-a', '2026-01-01T05:00:00-05:00', true, true, 'training', 'finished'),
              ('10', '101', '9', 'class-a', '2026-01-01T05:00:00-05:00', true, true, 'certification', 'finished'),
              ('14', '101', '9', 'class-a', '2026-01-01T11:00:00Z', true, true, 'CERTIFICATION ', 'finished'),
              ('11', '101', '10', 'class-a', '2026-01-01T09:00:00Z', true, true, 'training', 'finished'),
              ('12', '101', '9', 'class-b', '2026-01-01T09:00:00Z', true, true, 'training', 'finished'),
              ('13', '102', '9', 'class-a', '2026-01-01T09:00:00Z', true, true, 'training', 'finished'),
              ('20', '101', NULL, 'class-a', '2026-01-01T09:00:00Z', true, true, 'training', 'finished'),
              ('21', '101', '', 'class-a', '2026-01-01T09:00:00Z', true, true, 'training', 'finished'),
              ('22', '101', '9', NULL, '2026-01-01T09:00:00Z', true, true, 'training', 'finished'),
              ('23', '101', '9', '', '2026-01-01T09:00:00Z', true, true, 'training', 'finished'),
              ('24', NULL, '9', 'class-a', '2026-01-01T09:00:00Z', true, true, 'training', 'finished'),
              ('25', '', '9', 'class-a', '2026-01-01T09:00:00Z', true, true, 'training', 'finished'),
              ('26', '101', '9', 'class-a', NULL, true, true, 'training', 'finished'),
              ('27', '101', '9', 'class-a', '', true, true, 'training', 'finished'),
              ('28', '101', '9', 'class-a', 'invalid', true, true, 'training', 'finished'),
              ('29', '101', '9', 'class-a', '2026-01-01T08:00:00Z', false, true, 'training', 'finished'),
              ('30', '101', '9', 'class-a', '2026-01-01T08:00:00Z', true, false, 'training', 'finished'),
              ('31', '101', '11', 'class-a', '2026-01-01T23:30:00-05:00', true, true, 'training', 'finished'),
              ('32', '101', '11', 'class-a', '2026-01-02T02:00:00Z', true, true, 'training', 'finished'),
              ('bad-id', '101', '12', 'class-a', '2026-01-01T09:00:00Z', true, true, 'training', 'finished'),
              ('3', '101', '12', 'class-a', '2026-01-01T09:00:00Z', true, true, 'training', 'finished'),
              ('33', '101', '9', 'class-a', '2026-01-01T08:00:00Z', true, true, NULL, 'finished'),
              ('34', '101', '9', 'class-a', '2026-01-01T08:00:00Z', true, true, '', 'finished'),
              ('35', '101', '9', 'class-a', '2026-01-01T08:00:00Z', true, true, '   ', 'finished'),
              ('36', '101', '9', 'class-a', '2026-01-01T08:00:00Z', true, true, 'training', 'incomplete'),
              ('37', '101', '9', 'class-a', '2026-01-01T08:00:00Z', true, true, 'training', NULL)
          )
    expect:
      format: sql
      rows: |
        select *
        from values(
            'exam_attempt_id String, attempt_number Nullable(UInt64)',
            ('1', 1), ('2', 2), ('4', 3), ('10', 1), ('14', 2),
            ('11', 1), ('12', 1), ('13', 1),
            ('20', NULL), ('21', NULL), ('22', NULL), ('23', NULL),
            ('24', NULL), ('25', NULL), ('26', NULL), ('27', NULL),
            ('28', NULL), ('29', NULL), ('30', NULL), ('31', 2), ('32', 1),
            ('bad-id', 1), ('3', 2),
            ('33', NULL), ('34', NULL), ('35', NULL), ('36', NULL), ('37', NULL)
        )

  - name: test_mart_measureup_attempt_numbering_recomputes_corrected_history
    description: >
      Order a static snapshot by start time without gaps despite missing PKs.
      Metadata changes preserve the sequence; modes have independent sequences.
    model: mart_measureup_attempt_numbering
    given:
      - input: ref("mart_measureup_attempt_context")
        format: sql
        rows: |
          select
              exam_attempt_id, '101' as exam_test_id, flow_state,
              attempt_initiated_datetime,
              cast(null as Nullable(String)) as attempt_finished_datetime,
              '' as attempt_duration, final_score, 'False' as is_passed, mode,
              exam_test_name, 'same-product' as exam_test_product_id,
              true as has_lti_context, '9' as lti_user_id, 'class-a' as lti_course_id,
              true as has_licensed_class_context, '1' as institution_ccx_id,
              '1' as institution_id, '1' as license_id, 'Class' as class_name,
              attempt_user_type
          from values(
              'exam_attempt_id String, attempt_initiated_datetime String,
              flow_state String, mode String, final_score Nullable(String),
              exam_test_name String, attempt_user_type String',
              ('1', '2026-01-01T11:00:00Z', 'finished', 'training', '70', 'Old name', 'student'),
              ('10', '2026-01-01T10:00:00Z', 'finished', 'certification', NULL, 'New name', 'student'),
              ('40', '2026-01-01T08:00:00Z', 'finished', 'training', '80', 'New name', 'student'),
              ('20', '2026-01-01T09:30:00Z', 'finished', 'training', '90', 'New name', 'student'),
              ('50', '2026-01-01T12:00:00Z', 'finished', 'training', '95', 'New name', 'instructor')
          )
    expect:
      format: sql
      rows: |
        select *
        from values(
            'exam_attempt_id String, attempt_number Nullable(UInt64)',
            ('40', 1), ('20', 2), ('10', 1), ('1', 3), ('50', 4)
        )
