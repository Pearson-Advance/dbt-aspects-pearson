      format: sql
      rows: |
        select
            '1' as exam_attempt_id, '100' as exam_test_id, 'complete' as flow_state,
            '2026-01-01T00:00:00Z' as attempt_initiated_datetime,
            '2026-01-01T00:30:00Z' as attempt_finished_datetime, '00:30:00' as attempt_duration,
            '85' as final_score, 'True' as is_passed, 'proctored' as mode,
            'Active Test' as exam_test_name, 'PROD-1' as exam_test_product_id,
            true as has_lti_context, '5000' as lti_user_id,
