unit_tests:
  - name: test_mart_measureup_attempt_context_full_context_resolves
    description: >
      An attempt whose LTI launch context resolves, and whose LTI
      course_id matches a licensed class, surfaces both
      has_lti_context and has_licensed_class_context as true with the
      resolved institution/license identifiers projected through. Uses
      format: sql throughout; dbt-clickhouse 1.9.4 on dbt-core 1.9.11
      fails with a "get_expected_sql takes not more than 2 argument(s)"
      compiler error on the inline list-of-dicts rows: format.
    model: mart_measureup_attempt_context
    given:
      - input: ref("int_measureup_exam_test_attempt_current")
        format: sql
        rows: |
          select
              '1' as source_id, '100' as exam_test_id, '10' as lti_launch_event_id,
              'complete' as flow_state, '2026-01-01T00:00:00Z' as attempt_initiated_datetime,
              '2026-01-01T00:30:00Z' as attempt_finished_datetime, '00:30:00' as attempt_duration,
              '85' as final_score, 'True' as is_passed, 'proctored' as mode,
              '{}' as mup_attempt_configuration,
              'UPSERT' as operation, 'False' as is_deleted,
              '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-111111111101') as dump_id,
              toUUID('22222222-2222-2222-2222-222222222201') as sink_event_id,
              '2' as schema_version
      - input: ref("int_measureup_exam_test_current")
        format: sql
        rows: |
          select
              '100' as source_id, 'ext-100' as external_id, 'Active Test' as name,
              '50' as default_question_count, 'PROD-1' as product_id,
              '90' as exam_time, '70' as cut_score, 'REF-1' as reference,
              'proctored' as exam_mode, 'en' as exam_language,
              '2026-01-01T00:00:00Z' as exam_last_updated,
              'UPSERT' as operation, 'False' as is_deleted,
              '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-111111111110') as dump_id,
              toUUID('22222222-2222-2222-2222-222222222210') as sink_event_id,
              '2' as schema_version
      - input: ref("int_measureup_lti_launch_context_current")
        format: sql
        rows: |
          select
              '10' as source_id, '900' as course_enrollment_id, '5000' as user_id,
              'ccx-v1:TestOrg+A+2026' as course_id, 'block-1' as block_id,
              'rlid-1' as resource_link_id, 'PROD-1' as product_id,
              '2026-01-01T00:00:00Z' as last_launch_attempt_date,
              'UPSERT' as operation, 'False' as is_deleted,
              '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-111111111120') as dump_id,
              toUUID('22222222-2222-2222-2222-222222222220') as sink_event_id,
              '2' as schema_version
      - input: ref("int_course_licensing_institution_ccx_current")
        format: sql
        rows: |
          select
              '200' as source_id, '20' as id, '5' as institution_id,
              'Active University' as institution_name, '30' as license_id,
              'Active License' as license_name, 'active' as license_status,
              'ccx-v1:TestOrg+A+2026' as ccx_id, 'Class A' as ccx_name,
              'course-v1:TestOrg+A+2026' as master_course,
              'Master Course A' as master_course_name, 'False' as custom_course,
              '10' as min_students_allowed, 'False' as deleted,
              'UPSERT' as operation, 'False' as is_deleted,
              '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-111111111130') as dump_id,
              toUUID('22222222-2222-2222-2222-222222222230') as sink_event_id,
              '2' as schema_version
      - input: ref("int_course_licensing_licensed_enrollment_current")
        format: sql
        rows: |
          select
              '700' as source_id,
              '700' as id,
              '' as institution_id,
              '' as institution_name,
              '' as institution_ccx_id,
              cast(null as Nullable(String)) as license_id,
              cast(null as Nullable(String)) as license_name,
              cast(null as Nullable(String)) as license_status,
              '5000' as user_id,
              '' as student,
              '' as student_name,
              '' as student_email,
              '' as class_name,
              'ccx-v1:TestOrg+A+2026' as class_id,
              '' as enrollment_mode,
              '' as enrollment_created,
              '' as is_active,
              '' as end_date,
              '' as expired,
              'UPSERT' as operation,
              'False' as is_deleted,
              '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-000000000700') as dump_id,
              toUUID('22222222-2222-2222-2222-000000000700') as sink_event_id,
              '2' as schema_version
      - input: ref("int_course_licensing_instructor_class_current")
        format: sql
        rows: |
          select
              '' as source_id,
              '' as instructor_id,
              '' as user_id,
              '' as username,
              '' as user_email,
              '' as institution_ccx_id,
              '' as institution_id,
              cast(null as Nullable(String)) as license_id,
              '' as class_id,
              cast(null as Nullable(String)) as master_course_id,
              'UPSERT' as operation,
              'False' as is_deleted,
              '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-000000000000') as dump_id,
              toUUID('22222222-2222-2222-2222-000000000000') as sink_event_id,
              '2' as schema_version
          where 0
      - input: ref("int_course_licensing_instructor_current")
        format: sql
        rows: |
          select
              '' as source_id,
              '' as created,
              '' as modified,
              '' as user_id,
              '' as username,
              '' as email,
              '' as first_name,
              '' as last_name,
              '' as user_is_active,
              'UPSERT' as operation,
              'False' as is_deleted,
              '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-000000000000') as dump_id,
              toUUID('22222222-2222-2222-2222-000000000000') as sink_event_id,
              '2' as schema_version
          where 0
      - input: ref("int_course_licensing_institution_administrator_current")
        format: sql
        rows: |
          select
              '' as source_id,
              '' as id,
              '' as created,
              '' as modified,
              '' as institution_id,
              '' as institution_name,
              '' as user_id,
              '' as user_name,
              '' as user_email,
              '' as active,
              'UPSERT' as operation,
              'False' as is_deleted,
              '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-000000000000') as dump_id,
              toUUID('22222222-2222-2222-2222-000000000000') as sink_event_id,
              '2' as schema_version
          where 0
