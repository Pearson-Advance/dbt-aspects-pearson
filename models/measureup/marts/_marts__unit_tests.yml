unit_tests:
  - name: test_mart_measureup_attempt_context_full_context_resolves
    description: >
      An attempt whose LTI launch context resolves, and whose LTI
      course_id matches a licensed class, surfaces both
      has_lti_context and has_licensed_class_context as true with the
      resolved institution/license identifiers projected through. Uses
      format: sql throughout; dbt-clickhouse 1.9.4 on dbt-core 1.9.11
      fails with a "get_expected_sql takes not more than 2 argument(s)"
      compiler error on the inline list-of-dicts rows: format.
    model: mart_measureup_attempt_context
    given:
      - input: ref("int_measureup_exam_test_attempt_current")
        format: sql
        rows: |
          select
              '1' as source_id, '100' as exam_test_id, '10' as lti_launch_event_id,
              'complete' as flow_state, '2026-01-01T00:00:00Z' as attempt_initiated_datetime,
              '2026-01-01T00:30:00Z' as attempt_finished_datetime, '00:30:00' as attempt_duration,
              '85' as final_score, 'True' as is_passed, 'proctored' as mode,
              '{}' as mup_attempt_configuration,
              'UPSERT' as operation, 'False' as is_deleted,
              '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-111111111101') as dump_id,
              toUUID('22222222-2222-2222-2222-222222222201') as sink_event_id,
              '2' as schema_version
      - input: ref("int_measureup_exam_test_current")
        format: sql
        rows: |
          select
              '100' as source_id, 'ext-100' as external_id, 'Active Test' as name,
              '50' as default_question_count, 'PROD-1' as product_id,
              '90' as exam_time, '70' as cut_score, 'REF-1' as reference,
              'proctored' as exam_mode, 'en' as exam_language,
              '2026-01-01T00:00:00Z' as exam_last_updated,
              'UPSERT' as operation, 'False' as is_deleted,
              '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-111111111110') as dump_id,
              toUUID('22222222-2222-2222-2222-222222222210') as sink_event_id,
              '2' as schema_version
      - input: ref("int_measureup_lti_launch_context_current")
        format: sql
        rows: |
          select
              '10' as source_id, '900' as course_enrollment_id, '5000' as user_id,
              'ccx-v1:TestOrg+A+2026' as course_id, 'block-1' as block_id,
              'rlid-1' as resource_link_id, 'PROD-1' as product_id,
              '2026-01-01T00:00:00Z' as last_launch_attempt_date,
              'UPSERT' as operation, 'False' as is_deleted,
              '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-111111111120') as dump_id,
              toUUID('22222222-2222-2222-2222-222222222220') as sink_event_id,
              '2' as schema_version
      - input: ref("int_course_licensing_institution_ccx_current")
        format: sql
        rows: |
          select
              '200' as source_id, '20' as id, '5' as institution_id,
              'Active University' as institution_name, '30' as license_id,
              'Active License' as license_name, 'active' as license_status,
              'ccx-v1:TestOrg+A+2026' as ccx_id, 'Class A' as ccx_name,
              'course-v1:TestOrg+A+2026' as master_course,
              'Master Course A' as master_course_name, 'False' as custom_course,
              '10' as min_students_allowed, 'False' as deleted,
              'UPSERT' as operation, 'False' as is_deleted,
              '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-111111111130') as dump_id,
              toUUID('22222222-2222-2222-2222-222222222230') as sink_event_id,
              '2' as schema_version
    expect:
      format: sql
      rows: |
        select
            '1' as exam_attempt_id, '100' as exam_test_id, 'complete' as flow_state,
            '2026-01-01T00:00:00Z' as attempt_initiated_datetime,
            '2026-01-01T00:30:00Z' as attempt_finished_datetime, '00:30:00' as attempt_duration,
            '85' as final_score, 'True' as is_passed, 'proctored' as mode,
            'Active Test' as exam_test_name, 'PROD-1' as exam_test_product_id,
            true as has_lti_context, '5000' as lti_user_id,
            'ccx-v1:TestOrg+A+2026' as lti_course_id,
            true as has_licensed_class_context, '200' as institution_ccx_id,
            '5' as institution_id, '30' as license_id

  - name: test_mart_measureup_attempt_context_missing_lti_context_preserved
    description: >
      An attempt with no LTI launch context at all
      (lti_launch_event_id is null) must survive the left join — not be
      dropped — with has_lti_context/has_licensed_class_context both
      false and every column sourced from lti_context or institution_ccx
      returned as '' rather than NULL (ClickHouse's default
      join_use_nulls=0 fills a non-Nullable String miss with '').
      Uses format: sql, like every unit test in this file — see
      test_mart_measureup_attempt_context_full_context_resolves for why.
    model: mart_measureup_attempt_context
    given:
      - input: ref("int_measureup_exam_test_attempt_current")
        format: sql
        rows: |
          select
              '2' as source_id, '100' as exam_test_id,
              cast(null as Nullable(String)) as lti_launch_event_id,
              'incomplete' as flow_state, '2026-01-01T00:00:00Z' as attempt_initiated_datetime,
              cast(null as Nullable(String)) as attempt_finished_datetime,
              cast(null as Nullable(String)) as attempt_duration,
              cast(null as Nullable(String)) as final_score, 'False' as is_passed,
              'proctored' as mode,
              '{}' as mup_attempt_configuration,
              'UPSERT' as operation, 'False' as is_deleted,
              '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:02.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-111111111102') as dump_id,
              toUUID('22222222-2222-2222-2222-222222222202') as sink_event_id,
              '2' as schema_version
      - input: ref("int_measureup_exam_test_current")
        format: sql
        rows: |
          select
              '100' as source_id, 'ext-100' as external_id, 'Active Test' as name,
              '50' as default_question_count, 'PROD-1' as product_id,
              '90' as exam_time, '70' as cut_score, 'REF-1' as reference,
              'proctored' as exam_mode, 'en' as exam_language,
              '2026-01-01T00:00:00Z' as exam_last_updated,
              'UPSERT' as operation, 'False' as is_deleted,
              '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-111111111110') as dump_id,
              toUUID('22222222-2222-2222-2222-222222222210') as sink_event_id,
              '2' as schema_version
      - input: ref("int_measureup_lti_launch_context_current")
        format: sql
        rows: |
          select
              '10' as source_id, '900' as course_enrollment_id, '5000' as user_id,
              'ccx-v1:TestOrg+A+2026' as course_id, 'block-1' as block_id,
              'rlid-1' as resource_link_id, 'PROD-1' as product_id,
              '2026-01-01T00:00:00Z' as last_launch_attempt_date,
              'UPSERT' as operation, 'False' as is_deleted,
              '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-111111111120') as dump_id,
              toUUID('22222222-2222-2222-2222-222222222220') as sink_event_id,
              '2' as schema_version
      - input: ref("int_course_licensing_institution_ccx_current")
        format: sql
        rows: |
          select
              '200' as source_id, '20' as id, '5' as institution_id,
              'Active University' as institution_name, '30' as license_id,
              'Active License' as license_name, 'active' as license_status,
              'ccx-v1:TestOrg+A+2026' as ccx_id, 'Class A' as ccx_name,
              'course-v1:TestOrg+A+2026' as master_course,
              'Master Course A' as master_course_name, 'False' as custom_course,
              '10' as min_students_allowed, 'False' as deleted,
              'UPSERT' as operation, 'False' as is_deleted,
              '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-111111111130') as dump_id,
              toUUID('22222222-2222-2222-2222-222222222230') as sink_event_id,
              '2' as schema_version
    expect:
      format: sql
      rows: |
        select
            '2' as exam_attempt_id, '100' as exam_test_id, 'incomplete' as flow_state,
            '2026-01-01T00:00:00Z' as attempt_initiated_datetime,
            cast(null as Nullable(String)) as attempt_finished_datetime,
            cast(null as Nullable(String)) as attempt_duration,
            cast(null as Nullable(String)) as final_score, 'False' as is_passed,
            'proctored' as mode,
            'Active Test' as exam_test_name, 'PROD-1' as exam_test_product_id,
            false as has_lti_context, '' as lti_user_id,
            '' as lti_course_id,
            false as has_licensed_class_context, '' as institution_ccx_id,
            '' as institution_id, '' as license_id

  - name: test_mart_measureup_attempt_context_unmatched_licensed_class_preserved
    description: >
      An attempt whose LTI launch context resolves, but whose LTI
      course_id does not match any row in
      int_course_licensing_institution_ccx_current (unlicensed or
      unknown class), must still surface has_lti_context true while
      has_licensed_class_context is false — an unresolved ownership
      link stays visible rather than disappearing through the join.
      Uses format: sql, like every unit test in this file — see
      test_mart_measureup_attempt_context_full_context_resolves for why.
    model: mart_measureup_attempt_context
    given:
      - input: ref("int_measureup_exam_test_attempt_current")
        format: sql
        rows: |
          select
              '3' as source_id, '100' as exam_test_id, '11' as lti_launch_event_id,
              'complete' as flow_state, '2026-01-01T00:00:00Z' as attempt_initiated_datetime,
              '2026-01-01T00:20:00Z' as attempt_finished_datetime, '00:20:00' as attempt_duration,
              '60' as final_score, 'False' as is_passed, 'proctored' as mode,
              '{}' as mup_attempt_configuration,
              'UPSERT' as operation, 'False' as is_deleted,
              '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:03.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-111111111103') as dump_id,
              toUUID('22222222-2222-2222-2222-222222222203') as sink_event_id,
              '2' as schema_version
      - input: ref("int_measureup_exam_test_current")
        format: sql
        rows: |
          select
              '100' as source_id, 'ext-100' as external_id, 'Active Test' as name,
              '50' as default_question_count, 'PROD-1' as product_id,
              '90' as exam_time, '70' as cut_score, 'REF-1' as reference,
