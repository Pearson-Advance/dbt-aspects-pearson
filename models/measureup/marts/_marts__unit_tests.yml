              toUUID('11111111-1111-1111-1111-111111111110') as dump_id,
              toUUID('22222222-2222-2222-2222-222222222210') as sink_event_id,
              '2' as schema_version
      - input: ref("int_measureup_lti_launch_context_current")
        format: sql
        rows: |
          select
              '11' as source_id, '901' as course_enrollment_id, '5001' as user_id,
              'ccx-v1:TestOrg+UNKNOWN+2026' as course_id, 'block-1' as block_id,
              'rlid-2' as resource_link_id, 'PROD-1' as product_id,
              '2026-01-01T00:00:00Z' as last_launch_attempt_date,
              'UPSERT' as operation, 'False' as is_deleted,
              '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:02.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-111111111121') as dump_id,
              toUUID('22222222-2222-2222-2222-222222222221') as sink_event_id,
              '2' as schema_version
      - input: ref("int_course_licensing_institution_ccx_current")
        format: sql
        rows: |
          select
              '200' as source_id, '20' as id, '5' as institution_id,
              'Active University' as institution_name, '30' as license_id,
              'Active License' as license_name, 'active' as license_status,
              'ccx-v1:TestOrg+A+2026' as ccx_id, 'Class A' as ccx_name,
              'course-v1:TestOrg+A+2026' as master_course,
              'Master Course A' as master_course_name, 'False' as custom_course,
              '10' as min_students_allowed, 'False' as deleted,
              'UPSERT' as operation, 'False' as is_deleted,
              '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-111111111130') as dump_id,
