version: 2

models:
  - name: mart_measureup_attempt_numbering
    description: >
      One row per current non-deleted source attempt, exposing only
      exam_attempt_id and nullable UInt64 attempt_number. Uses resolved keys
      from mart_measureup_attempt_context without carrying its context payload.
      Unlike latest-attempt selection, this retains
      every distinct surviving attempt. Snapshot deduplication and tombstones
      are handled upstream; replayed exports do not create new attempts.

      Qualifying attempts have resolved LTI and licensed-class context,
      non-empty LTI user/course and exact Django ExamTest primary-key
      identifiers, and a parseable start. Numbering is one-based within
      (lti_user_id, lti_course_id, exam_test_id), ordered by UTC start ascending
      then numeric exam_attempt_id ascending. Modes, completion and pass/fail
      do not reset or restrict the sequence. Separate test IDs reset it;
      metadata changes on the same ID do not. Ineligible attempts remain
      present with NULL numbers and do not shift qualifying ordinals.

      This ordinary view recomputes numbering over available history when
      queried; historical inserts, corrected starts, restored context and
      deletions may renumber subsequent attempts. It does not precompute the
      window or guarantee lifetime history. Apply dashboard filters only
      downstream. No student-role filter or result joins are applied here.
      Attempt, domain, subdomain and question reports separately left join
      this ordinal by exam_attempt_id alongside context, without recalculating
      it. Readiness remains independent. Persistence
      and representative computation-cost measurements are separate work.
    columns:
      - name: exam_attempt_id
        description: Source Django ExamTestAttempt primary key, inherited from context.
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('mart_measureup_attempt_context')
              field: exam_attempt_id
      - name: attempt_number
        description: >
          Nullable UInt64 chronological ordinal: 1 for the earliest qualifying
          attempt in a learner/course/exact-test sequence. Equal starts use
          ascending numeric attempt PK via toUInt64OrZero, not lexical String
          order; unparseable ID strings convert to 0. NULL when
          required identity, context or start is unresolved. Lower-grain
          consumers must inherit this value by exam_attempt_id, never rank
          after joining results.
  - name: mart_measureup_attempt_context
    description: >
      Shared reusable transformation: one row per current exam attempt,
      enriched with the exact test version attempted, its LTI launch
      context when available, and the licensed class that context belongs
      to when available. Reused by every presentation view descended from
      an attempt (rpt_measureup_attempts, _domain_performance,
      _subdomain_performance, _question_performance) so this join chain is
      written exactly once. Not a dashboard-facing model itself — it is an
      internal building block for models/measureup/presentation/.


      Every join is at most 1:1 (foreign key to the target's source_id, or
      a deduplicated ccx_id), so this cannot multiply attempt rows —
      verified against real data: mart row count equals
      int_measureup_exam_test_attempt_current row count exactly.
    data_tests:
      - unique:
          column_name: exam_attempt_id
      - not_null:
          column_name: exam_attempt_id
    columns:
      - name: exam_attempt_id
        description: Same value as int_measureup_exam_test_attempt_current.source_id.
      - name: exam_test_id
        description: >
          Exact MeasureUp test-version source_id attempted. Never collapse
          by exam_test_product_id or exam_test_name — two versions of the
          same product can differ in content, scoring, and cut score, so
          they must stay distinguishable downstream.
      - name: is_passed
        description: >
          Source-reported pass/fail for this attempt. Only meaningful for
          completed attempts — see flow_state before treating an
          incomplete attempt as failed.
      - name: has_lti_context
        description: >
          False when this attempt's lti_launch_event_id did not resolve to
          any row in int_measureup_lti_launch_context_current. Made
          explicit instead of silently dropping the attempt via an inner
          join.
      - name: has_licensed_class_context
        description: >
          False when the resolved LTI context's course_id did not match
          any ccx_id in int_course_licensing_institution_ccx_current — or
          when there was no LTI context at all. Institution-scoped
          consumption must treat False here as "ownership unresolved", not
          as "belongs to no institution".
      - name: institution_id
        description: >
          Raw Django primary key of the owning Institution
          (course_licensing), when has_licensed_class_context is true.
      - name: class_name
        description: >
          Display name of the licensed class (institution_ccx.ccx_name),
          when has_licensed_class_context is true; '' otherwise. Not
          guaranteed unique — two classes can share a name, so use
          lti_course_id, not this column, to identify a class.
      - name: attempt_user_type
        description: >
          Who launched the attempt, inferred from Course Licensing data for
          the LTI launch's user and class, checked in this order: 'student'
          (licensed enrollment in this class), 'instructor' (instructor of
          this class or of any other), 'institution_admin' (institution
          administrator), 'other' (anything else, including launches from a
          master course and attempts with no LTI context). Not the launch's
          real LTI role. This mart keeps every type; the presentation
          models keep only 'student'.
        data_tests:
          - not_null
          - accepted_values:
              values: ["student", "instructor", "institution_admin", "other"]
