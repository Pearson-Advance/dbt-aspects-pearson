unit_tests:
  - name: test_measureup_exam_attempt_domain_current_filters_tombstones
    description: The current view keeps active exam_attempt_domain rows and excludes tombstones.
    model: int_measureup_exam_attempt_domain_current
    given:
      - input: ref("int_measureup_exam_attempt_domain_latest_state")
        format: sql
        rows: |
          select '11' as source_id, '301' as exam_domain_id, '1' as exam_attempt_id, '80.00' as average_score,
              'UPSERT' as operation, 'False' as is_deleted, '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-000000000001') as dump_id,
              toUUID('22222222-2222-2222-2222-000000000001') as sink_event_id, '2' as schema_version
          union all
          select '12' as source_id, '302' as exam_domain_id, '2' as exam_attempt_id, '65.00' as average_score,
              'DELETE' as operation, 'True' as is_deleted, '2026-01-01 00:00:01.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:02.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-000000000002') as dump_id,
              toUUID('22222222-2222-2222-2222-000000000002') as sink_event_id, '2' as schema_version
    expect:
      format: sql
      rows: |
        select '11' as source_id, '301' as exam_domain_id, '1' as exam_attempt_id, '80.00' as average_score,
            'UPSERT' as operation, 'False' as is_deleted, '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
            '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
            toUUID('11111111-1111-1111-1111-000000000001') as dump_id,
            toUUID('22222222-2222-2222-2222-000000000001') as sink_event_id, '2' as schema_version
  - name: test_measureup_exam_attempt_subdomain_current_filters_tombstones
    description: The current view keeps active exam_attempt_subdomain rows and excludes tombstones.
    model: int_measureup_exam_attempt_subdomain_current
    given:
      - input: ref("int_measureup_exam_attempt_subdomain_latest_state")
        format: sql
        rows: |
          select '21' as source_id, '401' as exam_subdomain_id, '11' as attempt_domain_id, '78.00' as average_score,
              'UPSERT' as operation, 'False' as is_deleted, '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-000000000001') as dump_id,
              toUUID('22222222-2222-2222-2222-000000000001') as sink_event_id, '2' as schema_version
          union all
          select '22' as source_id, '402' as exam_subdomain_id, '12' as attempt_domain_id, '60.00' as average_score,
              'DELETE' as operation, 'True' as is_deleted, '2026-01-01 00:00:01.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:02.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-000000000002') as dump_id,
              toUUID('22222222-2222-2222-2222-000000000002') as sink_event_id, '2' as schema_version
    expect:
      format: sql
      rows: |
        select '21' as source_id, '401' as exam_subdomain_id, '11' as attempt_domain_id, '78.00' as average_score,
            'UPSERT' as operation, 'False' as is_deleted, '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
            '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
            toUUID('11111111-1111-1111-1111-000000000001') as dump_id,
            toUUID('22222222-2222-2222-2222-000000000001') as sink_event_id, '2' as schema_version
  - name: test_measureup_exam_question_attempt_current_filters_tombstones
    description: The current view keeps active exam_question_attempt rows and excludes tombstones.
    model: int_measureup_exam_question_attempt_current
    given:
      - input: ref("int_measureup_exam_question_attempt_latest_state")
        format: sql
        rows: |
          select '31' as source_id, '501' as question_id, '21' as subdomain_attempt_id,
              cast(null as Nullable(String)) as score, 'False' as answer_shown, 'False' as review_marked,
              'unanswered' as status, 'True' as displayed, '{"selected":[],"text":null}' as answer,
              'UPSERT' as operation, 'False' as is_deleted, '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-000000000001') as dump_id,
              toUUID('22222222-2222-2222-2222-000000000001') as sink_event_id, '2' as schema_version
          union all
          select '32' as source_id, '502' as question_id, '22' as subdomain_attempt_id, '100.00' as score,
              'True' as answer_shown, 'True' as review_marked, 'answered' as status, 'True' as displayed,
              '{"selected":["option-a"]}' as answer, 'DELETE' as operation, 'True' as is_deleted,
              '2026-01-01 00:00:01.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:02.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-000000000002') as dump_id,
              toUUID('22222222-2222-2222-2222-000000000002') as sink_event_id, '2' as schema_version
    expect:
      format: sql
      rows: |
        select '31' as source_id, '501' as question_id, '21' as subdomain_attempt_id,
            cast(null as Nullable(String)) as score, 'False' as answer_shown, 'False' as review_marked,
            'unanswered' as status, 'True' as displayed, '{"selected":[],"text":null}' as answer,
            'UPSERT' as operation, 'False' as is_deleted, '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
            '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
            toUUID('11111111-1111-1111-1111-000000000001') as dump_id,
            toUUID('22222222-2222-2222-2222-000000000001') as sink_event_id, '2' as schema_version
