          intended for general Superset exposure.
        data_tests:
          - measureup_valid_json:
              config:
                tags:
                  - measureup
                  - measureup_exam_catalog
      - name: is_deleted
        description: Always 'False' here by construction — tombstones are filtered out.
        data_tests:
          - accepted_values:
              values: ["False"]
