  - name: int_measureup_exam_domain_current
    description: >
      Current-state view of ExamDomain records: exactly one row per
      source_id whose most recent event was not a DELETE. This is the
      model reporting and dashboards should query — never the raw
      event_sink table directly.
    data_tests:
      - measureup_current_matches_latest_event:
          source_name: measureup_event_sink
          source_table: measureup_exam_domain
    columns:
      - name: source_id
        description: Raw Django primary key of the source ExamDomain row.
        data_tests:
          - unique
          - not_null
      - name: exam_test_id
        description: >
          Raw Django primary key of the parent ExamTest row. The Django
          relation is on_delete=CASCADE (verified in
          measureup_plugin/models.py), so a normal delete cannot orphan
          this row — severity is warn rather than a hard failure because a
          migration or raw-SQL operation that bypasses Django's ORM could
          still do so (the same real scenario confirmed in
          course_licensing's PR #11 relationship-test incident).
        data_tests:
          - not_null
          - relationships:
              to: ref('int_measureup_exam_test_current')
              field: source_id
              config:
                severity: warn
      - name: is_deleted
        description: Always 'False' here by construction — tombstones are filtered out.
        data_tests:
          - accepted_values:
              values: ["False"]

