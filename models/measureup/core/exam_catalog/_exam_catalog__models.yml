        description: Question display name.
        data_tests:
          - not_null
      - name: content
        description: >
          Canonical JSON with the question's restricted content (stem,
          choices, etc.). Not intended for general Superset exposure —
          mirrors course_licensing_other_course_settings_cache.settings.
          Defaults to '{}' at the ClickHouse column level.
      - name: is_deleted
