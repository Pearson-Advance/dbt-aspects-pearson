      One row per source_id, resolved from
      mv_measureup_exam_domain_latest_state into plain columns — the most
      recent UPSERT or DELETE event recorded for each ExamDomain record,
      regardless of whether that record is currently deleted.
    columns:
      - name: source_id
        description: Raw Django primary key of the source ExamDomain row.
        data_tests:
          - unique
          - not_null
      - name: exam_test_id
        description: Raw Django primary key of the parent ExamTest row.
        data_tests:
          - not_null
      - name: name
        description: Domain display name.
        data_tests:
          - not_null
      - name: is_deleted
        description: >
          Sink tombstone flag for this event. Stored as the sink's own
          'True'/'False' string values.
        data_tests:
          - accepted_values:
              values: ["True", "False"]
      - name: time_last_dumped
        description: When this event was written to ClickHouse.
      - name: sink_event_id
        description: >
          Unique identifier for this specific sink event; the final
          tie-breaker in the latest-state ordering when every other field
