version: 2

models:
  - name: mv_measureup_exam_test_attempt_latest_state
    description: >
      Incrementally maintained argMax aggregate state for ExamTestAttempt events,
      one row per source_id.
    columns:
      - name: source_id
        description: Source model primary key.
        data_tests:
          - not_null
      - name: latest_state
        description: Opaque argMaxState finalized by the corresponding latest-state view.
  - name: int_measureup_exam_test_attempt_latest_state
    description: >
      One finalized latest UPSERT or DELETE event per ExamTestAttempt source_id.
    columns:
      - name: source_id
        description: Source model primary key.
        data_tests:
          - unique
          - not_null
      - name: operation
        description: Sink operation represented by the latest event.
        data_tests:
          - accepted_values:
              values: ["UPSERT", "DELETE"]
      - name: is_deleted
        description: Sink tombstone flag stored as 'True' or 'False'.
        data_tests:
          - accepted_values:
              values: ["True", "False"]
      - name: time_last_dumped
        description: Primary timestamp used to resolve the latest event per source_id.
        data_tests:
          - not_null
      - name: sink_event_id
        description: Deterministic final tie-breaker for latest-event ordering.
        data_tests:
          - not_null
  - name: int_measureup_exam_test_attempt_current
    description: >
      Current non-deleted representation of ExamTestAttempt, one row per source_id.
    data_tests:
      - measureup_current_matches_latest_event:
          source_name: measureup_event_sink
          source_table: measureup_exam_test_attempt
    columns:
      - name: source_id
        description: Source model primary key.
        data_tests:
          - unique
          - not_null
      - name: exam_test_id
        description: Exact MeasureUp test-version source_id referenced by the attempt.
        data_tests:
          - not_null
          - relationships:
              to: ref('int_measureup_exam_test_current')
              field: source_id
              config:
                severity: warn
      - name: lti_launch_event_id
        description: >
          Optional source_id of the independently delivered MeasureUp LTI launch context.
        data_tests:
          - relationships:
              to: ref('int_measureup_lti_launch_context_current')
              field: source_id
              config:
                severity: warn
      - name: mup_attempt_configuration
        description: Restricted canonical JSON with the attempt configuration.
        data_tests:
          - measureup_valid_json:
              config:
                tags:
                  - measureup
                  - measureup_attempts_results_readiness_lti
                  - measureup_attempts
      - name: is_deleted
        description: Always 'False' in the current model.
        data_tests:
          - accepted_values:
              values: ["False"]
      - name: schema_version
        description: MeasureUp event-sink schema version.
        data_tests:
          - accepted_values:
              values: ["2"]
  - name: mv_measureup_lti_launch_context_latest_state
    description: >
      Incrementally maintained argMax aggregate state for MeasureUp-scoped LTI launch context events,
      one row per source_id.
    columns:
      - name: source_id
        description: Source model primary key.
        data_tests:
          - not_null
      - name: latest_state
        description: Opaque argMaxState finalized by the corresponding latest-state view.
  - name: int_measureup_lti_launch_context_latest_state
    description: >
      One finalized latest UPSERT or DELETE event per MeasureUp-scoped LTI launch context source_id.
    columns:
      - name: source_id
        description: Source model primary key.
        data_tests:
          - unique
          - not_null
      - name: operation
        description: Sink operation represented by the latest event.
        data_tests:
          - accepted_values:
              values: ["UPSERT", "DELETE"]
      - name: is_deleted
        description: Sink tombstone flag stored as 'True' or 'False'.
        data_tests:
          - accepted_values:
              values: ["True", "False"]
      - name: time_last_dumped
        description: Primary timestamp used to resolve the latest event per source_id.
        data_tests:
          - not_null
      - name: sink_event_id
        description: Deterministic final tie-breaker for latest-event ordering.
        data_tests:
          - not_null
  - name: int_measureup_lti_launch_context_current
    description: >
      Current non-deleted representation of MeasureUp-scoped LTI launch context, one row per source_id.
    data_tests:
      - measureup_current_matches_latest_event:
          source_name: measureup_event_sink
          source_table: measureup_lti_launch_context
    columns:
      - name: source_id
        description: Source model primary key.
        data_tests:
          - unique
          - not_null
      - name: course_enrollment_id
        description: Related Open edX course-enrollment identifier when available.
      - name: resource_link_id
        description: LTI resource-link identifier captured at launch time.
      - name: product_id
        description: MeasureUp product identifier, currently derived from resource_link_id.
      - name: last_launch_attempt_date
        description: Latest launch timestamp available on the source LTI row.
      - name: is_deleted
        description: Always 'False' in the current model.
        data_tests:
          - accepted_values:
              values: ["False"]
      - name: schema_version
        description: MeasureUp event-sink schema version.
        data_tests:
          - accepted_values:
              values: ["2"]
