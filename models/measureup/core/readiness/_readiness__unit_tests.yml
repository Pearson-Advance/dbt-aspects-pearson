unit_tests:
  - name: test_measureup_exam_ready_status_current_filters_tombstones
    description: The current view keeps active exam_ready_status rows and excludes tombstones.
    model: int_measureup_exam_ready_status_current
    given:
      - input: ref("int_measureup_exam_ready_status_latest_state")
        format: sql
        rows: |
          select '41' as source_id, '501' as course_enrollment_id, '42' as user_id,
              'course-v1:VUE+AZ900+2026' as course_id, 'audit' as enrollment_mode, 'True' as enrollment_is_active,
              'EPP_ELIGIBLE' as status, '82.50' as last_score, '2026-01-01 00:00:00+00:00' as status_updated_at,
              'UPSERT' as operation, 'False' as is_deleted, '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-000000000001') as dump_id,
              toUUID('22222222-2222-2222-2222-000000000001') as sink_event_id, '2' as schema_version
          union all
          select '42' as source_id, '502' as course_enrollment_id, '43' as user_id,
              'course-v1:VUE+AZ104+2026' as course_id, 'verified' as enrollment_mode, 'False' as enrollment_is_active,
              'NOT_READY' as status, cast(null as Nullable(String)) as last_score,
              '2026-01-01 01:00:00+00:00' as status_updated_at, 'DELETE' as operation, 'True' as is_deleted,
              '2026-01-01 00:00:01.000000+00:00' as source_updated_at,
              '2026-01-01 00:00:02.000000+00:00' as time_last_dumped,
              toUUID('11111111-1111-1111-1111-000000000002') as dump_id,
              toUUID('22222222-2222-2222-2222-000000000002') as sink_event_id, '2' as schema_version
    expect:
      format: sql
      rows: |
        select '41' as source_id, '501' as course_enrollment_id, '42' as user_id,
            'course-v1:VUE+AZ900+2026' as course_id, 'audit' as enrollment_mode, 'True' as enrollment_is_active,
            'EPP_ELIGIBLE' as status, '82.50' as last_score, '2026-01-01 00:00:00+00:00' as status_updated_at,
            'UPSERT' as operation, 'False' as is_deleted, '2026-01-01 00:00:00.000000+00:00' as source_updated_at,
            '2026-01-01 00:00:01.000000+00:00' as time_last_dumped,
            toUUID('11111111-1111-1111-1111-000000000001') as dump_id,
            toUUID('22222222-2222-2222-2222-000000000001') as sink_event_id, '2' as schema_version
