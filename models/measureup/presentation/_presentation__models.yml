version: 2

models:
  - name: rpt_measureup_attempts
    description: >
      Dashboard-ready grain: one row per current student exam attempt.
      Built on mart_measureup_attempt_context — test version, LTI context,
      licensed-class ownership and attempt_user_type are already resolved
      there. Only attempts with attempt_user_type = 'student' are kept;
      instructor, administrator and other launches stay in the mart only.

      Materialized as a refreshable materialized view refreshed every 4
      hours: dashboards read a stored result that can be up to 4 hours
      old. Ordered by (institution_id, lti_course_id,
      attempt_initiated_datetime, ...) so institution and class filters,
      including row-level security, read only their own rows.
      Adding a column or changing the ordering needs a --full-refresh of
      this model.


      Completion rule: an attempt is completed only when flow_state =
      'finished' AND attempt_finished_datetime is not null. Do not infer
      completion from is_passed, final_score, or duration alone — an
      unfinished attempt can still carry partial or stale values.


      Pass-rate rule: eligible denominator is completed attempts only (per
      the rule above). is_passed reflects the source system's own
      pass/fail determination for a completed attempt; an unfinished
      attempt must not be counted as failed, and must not be included in
      either the numerator or the denominator of a pass rate.


      Duration: attempt_duration preserves the raw integration value.
      Representative deployed records serialize it as H+:MM:SS with
      second precision. attempt_duration_seconds normalizes supported
      duration values as an interval in seconds; missing, malformed, and
      negative values remain NULL. Durations longer than 24 hours do not
      wrap. attempt_ended_at_utc is a calculated value based on the
      canonical UTC start plus normalized duration and remains distinct
      from the source-reported attempt_finished_at.
    data_tests:
      - unique:
          column_name: exam_attempt_id
      - not_null:
          column_name: exam_attempt_id
    columns:
      - name: exam_attempt_id
        description: Grain key — same value as int_measureup_exam_test_attempt_current.source_id.
      - name: attempt_initiated_at
        description: >
          attempt_initiated_datetime converted to DateTime64(6, 'UTC') once
          per refresh. Prefer this over parsing the text column. NULL when
          the text is empty or not a timestamp.
      - name: attempt_finished_at
        description: >
          Source-reported attempt_finished_datetime converted to
          DateTime64(6, 'UTC') once per refresh. NULL when the source
          finish is unavailable. This remains distinct from
          attempt_ended_at_utc, which is calculated from start plus
          recorded duration.
      - name: attempt_duration
        description: >
          Raw duration value supplied by the MeasureUp integration.
          Representative deployed records use H+:MM:SS with second
          precision. Preserved unchanged for source traceability.
      - name: attempt_duration_seconds
        description: >
          Recorded attempt duration normalized to numeric seconds.
          Supported H+:MM:SS values may include up to six fractional
          second digits. Missing, malformed, or negative values remain
          NULL rather than being coerced to zero. Duration is treated as
          an interval, so values longer than 24 hours do not wrap.
      - name: attempt_ended_at_utc
        description: >
          Calculated End Date in UTC: attempt_initiated_at plus
          attempt_duration_seconds. Populated only when flow_state is
          'finished', a valid source finish exists, and start and duration
          are valid. A genuine zero duration produces an end equal to the
          start. This field does not replace attempt_finished_at and does
          not independently establish the source submission time.
      - name: exam_test_id
        description: >
          Exact MeasureUp test-version source_id attempted. Never collapse
          by exam_test_product_id or exam_test_name — different versions
          of the same product/name must stay distinguishable.
      - name: is_passed
        description: Only meaningful when flow_state indicates the attempt completed.
      - name: has_lti_context
        description: >
          False when this attempt has no matching row in
          int_measureup_lti_launch_context_current. Filter tools should
          treat this as "context unresolved", not "not applicable".
      - name: has_licensed_class_context
        description: >
          False when the resolved LTI context's course did not match any
          licensed class in course_licensing. Row-level security scoped by
          institution_id must exclude rows where this is false, rather
          than silently including them under no institution.
      - name: institution_id
        description: >
          course_licensing Institution owning this attempt's class, when
          has_licensed_class_context is true. Empty string, not NULL, when
          false — see mart_measureup_attempt_context's header for why.
      - name: class_name
        description: >
          Display name of the licensed class. Not guaranteed unique — use
          lti_course_id to identify a class.
      - name: student_name
        description: >
          The learner's profile name from the licensed enrollment, falling
          back to the username when the profile name is empty. This is the
          column dashboards show.
      - name: student_username
        description: >
          The learner's username from the licensed enrollment. Kept for
          data checks, such as finding learners without a profile name;
          not meant to be shown on dashboards.
      - name: correct
        description: Number of question results with a score of 1 for this attempt.
      - name: total
        description: >
          Number of question results for this attempt, including those with
          no score. MeasureUp's final_score counts a question with no score
          as incorrect, so correct / total matches final_score.

  - name: rpt_measureup_domain_performance
    description: >
      Dashboard-ready grain: one row per current attempt-domain result.
      Both joins (to the domain dimension and to the attempt context) are
      foreign-key-to-source_id, at most 1:1, so they cannot inflate rows.
      Only results of attempts with attempt_user_type = 'student' are
      kept, so row count equals the student share of
      int_measureup_exam_attempt_domain_current, not all of it.


      average_score is the domain-level average exactly as emitted by the
      source integration — do not recompute it from question-level scores
      here; there is no defined weighting rule for doing so at this grain.
    data_tests:
      - unique:
          column_name: attempt_domain_id
      - not_null:
          column_name: attempt_domain_id
    columns:
      - name: attempt_domain_id
        description: Grain key — same value as int_measureup_exam_attempt_domain_current.source_id.
      - name: exam_attempt_id
        description: >
          Owning attempt's source_id — join key back to
          rpt_measureup_attempts for test-version and ownership context.
      - name: average_score
        description: Domain-level average score, as emitted by the source integration.

  - name: rpt_measureup_subdomain_performance
    description: >
      Dashboard-ready grain: one row per current attempt-subdomain result.
      attempt_subdomain only carries attempt_domain_id, not
      exam_attempt_id directly — the join chain passes through
      int_measureup_exam_attempt_domain_current to reach the attempt and
      its resolved context. Every join is foreign-key-to-source_id, at
      most 1:1, so they cannot inflate rows. Only results of attempts with
      attempt_user_type = 'student' are kept, so row count equals the
      student share of int_measureup_exam_attempt_subdomain_current, not
      all of it.
    data_tests:
      - unique:
          column_name: attempt_subdomain_id
      - not_null:
          column_name: attempt_subdomain_id
    columns:
      - name: attempt_subdomain_id
        description: Grain key — same value as int_measureup_exam_attempt_subdomain_current.source_id.
      - name: attempt_domain_id
        description: Owning attempt-domain result's source_id.
      - name: exam_attempt_id
        description: Owning attempt's source_id, recovered via attempt_domain.
      - name: average_score
        description: Subdomain-level average score, as emitted by the source integration.

  - name: rpt_measureup_question_performance
    description: >
      Dashboard-ready grain: one row per current question-attempt result —
      the finest grain in this reporting layer. Three hops back to the
      attempt and its resolved context (question_attempt ->
      attempt_subdomain -> attempt_domain -> mart), each
      foreign-key-to-source_id, at most 1:1, plus the domain and subdomain
      catalog joins for their display names. Only question results of
      attempts with attempt_user_type = 'student' are kept, so row count
      equals the student share of int_measureup_exam_question_attempt_current,
      not all of it. A question whose chain does not reach an attempt is
      dropped as well, since its learner cannot be classified.

      Materialized as a refreshable materialized view refreshed every 4
      hours: dashboards read a stored result that can be up to 4 hours
      old. Ordered by (institution_id, lti_course_id,
      attempt_initiated_datetime, ...) so institution and class filters,
      including row-level security, read only their own rows.
      Adding a column or changing the ordering needs a --full-refresh of
      this model.


      score is nullable exactly as emitted by the source — a missing
      question score must not be treated as zero when averaging; exclude
      null scores from the denominator rather than counting them as a
      zero result.


      question.content (the question text/choices) and
      question_attempt.answer (the learner's raw answer) are restricted
      and are never projected in this or any other presentation view.
    data_tests:
      - unique:
          column_name: question_attempt_id
      - not_null:
          column_name: question_attempt_id
    columns:
      - name: question_attempt_id
        description: Grain key — same value as int_measureup_exam_question_attempt_current.source_id.
      - name: attempt_initiated_at
        description: >
          attempt_initiated_datetime converted to DateTime64(6, 'UTC') once
          per refresh. Prefer this over parsing the text column. NULL when
          the text is empty or not a timestamp.
      - name: attempt_finished_at
        description: >
          attempt_finished_datetime converted to DateTime64(6, 'UTC') once
          per refresh. NULL for attempts that have not finished.
      - name: score
        description: >
          Nullable exactly as emitted by the source. Exclude nulls from an
          average rather than treating a missing score as 0.
      - name: exam_attempt_id
        description: Owning attempt's source_id, recovered via attempt_subdomain and attempt_domain.
      - name: exam_domain_name
        description: Display name of the exam domain, from int_measureup_exam_domain_current.
      - name: exam_subdomain_name
        description: Display name of the exam subdomain, from int_measureup_exam_subdomain_current.
      - name: lti_course_id
        description: >
          Class (CCX) the owning attempt was launched from. Use this, not
          class_name, to identify a class.
      - name: class_name
        description: >
          Display name of the owning attempt's licensed class. Not
          guaranteed unique — two classes can share a name.

  - name: rpt_measureup_exam_readiness
    description: >
      Dashboard-ready grain: one row per current readiness record, at
      enrollment grain — independent of any specific exam attempt.
      Deliberately not joined to mart_measureup_attempt_context: readiness
      is a property of the learner's course enrollment as of now, not of
      any single historical attempt, so it must not be duplicated across
      an enrollment's attempts nor presented as "readiness at attempt
      time".


      Readiness-count rule: count distinct exam_ready_status_id (this
      model's own grain key) per status, filtered by course_id/
      enrollment_mode as needed — never join this to
      rpt_measureup_attempts to compute a combined count, since that
      would multiply readiness rows by however many attempts that learner
      has made.
    data_tests:
      - unique:
          column_name: exam_ready_status_id
      - not_null:
          column_name: exam_ready_status_id
    columns:
      - name: exam_ready_status_id
        description: Grain key — same value as int_measureup_exam_ready_status_current.source_id.
      - name: status
        description: Current MeasureUp readiness status for this enrollment.
      - name: last_score
        description: Nullable when no readiness score is available yet.
