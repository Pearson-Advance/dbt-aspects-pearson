name: "dbt_aspects_pearson"
version: "1.0.0"
config-version: 2

# The Ulmo Aspects image installs dbt 1.9.x. Keep this range synchronized
# with requirements.txt and compatibility.yml.
require-dbt-version: [">=1.9.0", "<1.10.0"]

profile: "aspects"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

# Keep the project default deliberately conservative. Models that must be
# persisted as ClickHouse materialized views opt in explicitly with
# config(materialized="materialized_view", ...).
models:
  dbt_aspects_pearson:
    +materialized: view
