name: "dbt_aspects_pearson"
version: "1.0.0"
config-version: 2

# The Ulmo Aspects image installs dbt 1.9.x. Keep this range synchronized
# with requirements.txt and compatibility.yml.
require-dbt-version: [">=1.9.0", "<1.10.0"]

profile: "aspects"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

# Keep the project default deliberately conservative. Models that must be
# persisted as ClickHouse materialized views opt in explicitly with
# config(materialized="materialized_view", ...).
models:
  dbt_aspects_pearson:
    +materialized: view

seeds:
  dbt_aspects_pearson:
    pss_insights:
      +tags: ["pss_insights"]
      pss_grading_policy:
        +column_types:
          master_course: String
          activity_type: String
          weight: Nullable(Float64)
          final_exam_pass_rule: Nullable(String)
          final_exam_pass_mark: Nullable(Float64)

      pss_assignment_type_mapping:
        +column_types:
          master_course: String
          assignment_type: String
          activity_type: String
      pss_curriculum_applicability:
        +column_types:
          ccx_id: String
          master_course: String
          snapshot_id: String
          rule: String
          subsection_block_id: String

vars:
  pss_activity_types: ["Quiz", "Lab", "Practice Exam", "Final Exam"]
