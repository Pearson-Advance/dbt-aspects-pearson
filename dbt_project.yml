name: "dbt_aspects_pearson"
version: "1.0.0"
config-version: 2

# The Ulmo Aspects image installs dbt 1.9.x. Keep this range synchronized
# with requirements.txt and compatibility.yml.
require-dbt-version: [">=1.9.0", "<1.10.0"]

profile: "aspects"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

# Keep the project default deliberately conservative. Models that must be
# persisted as ClickHouse materialized views opt in explicitly with
# config(materialized="materialized_view", ...).
models:
  dbt_aspects_pearson:
    +materialized: view

seeds:
  dbt_aspects_pearson:
    pss_insights:
      +tags: ["pss_insights"]
      pss_grading_policy:
        +column_types:
          master_course: String
          activity_type: String
          weight: Nullable(Float64)
          final_exam_pass_rule: Nullable(String)
          final_exam_pass_mark: Nullable(Float64)

vars:
  # PSS Insights. Taxonomies are selected by id: ids differ per environment
  # and taxonomy names can be edited in Studio. An unset env var (0 / empty)
  # means "not configured" and the dependent models return no rows.
  # Id of the activity-type taxonomy ("PSS Activity Type").
  pss_activity_type_taxonomy_id: "{{ env_var('PSS_ACTIVITY_TYPE_TAXONOMY_ID', '0') }}"
  # Comma-separated ids of the subdomain taxonomies, one per certification,
  # e.g. "30" or "30,31".
  pss_subdomain_taxonomy_ids: "{{ env_var('PSS_SUBDOMAIN_TAXONOMY_IDS', '') }}"
  # Accepted activity-type tag values (exact strings).
  pss_activity_types: ["Quiz", "Lab", "Practice Exam", "Final Exam"]
